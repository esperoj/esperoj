[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "esperoj"
version = "0.13.0"
description = "Esperoj package with cli."
authors = ["Esperoj <esperoj@esperoj.eu.org>"]
readme = "README.md"
repository = "https://github.com/esperoj/esperoj"

[tool.poetry.scripts]
esperoj = "esperoj.cli:cli"

[tool.poetry.dependencies]
python = "<4.0,>=3.11"
boto3 = ">=1.34.2"
seatable-api = ">=2.6.11"
requests = ">=2.32.3"
py7zr = ">=0.21.0"

[tool.poetry.group.server]
optional = true

[tool.poetry.group.server.dependencies]
litestar = {"version" = ">=2.8.3", extras = ["standard"]}

[tool.poetry.group.cli]
optional = true

[tool.poetry.group.cli.dependencies]
click = ">=8.1.7"

[tool.poetry.group.build]
optional = true

[tool.poetry.group.build.dependencies]
pdoc = ">=13.1.1"
nuitka = ">=2.2.3"
patchelf = ">=0.17.2.1"
zstandard = ">=0.22.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=7.3.1"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.12.0"
pytest-xdist = ">=3.2.1"
moto = ">=5"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = ">=0.1.3"
pyright = ">=1.1.341"
pre-commit = ">=3.3.1"

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
command_line = "--module pytest"
data_file = ".coverage"
parallel = true
source = ["src"]

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "tests"
]

[tool.pytest.ini_options]
addopts = "--verbose --cov-report xml --cov-report term --cov=src/esperoj --color=yes --exitfirst --failed-first"
testpaths = ["tests"]
xfail_strict = true
markers = [
  "only: run this only"
]

[tool.ruff]
fix = true
ignore-init-module-imports = true
line-length = 100
select = ["I", "E4", "E7", "E9", "F"]
ignore = []
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.pydocstyle]
convention = "google"
