[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [
  {name = "Esperoj", email = "esperoj@esperoj.eu.org"}
]
description = "This is my personal package used to automate the boring stuffs."
license = {text = "GPLv3"}
name = "esperoj"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "click",
  "django>=5.2,<5.3",
  "django-simple-history",
  "django-select2",
  "internetarchive>=5.4.0",
  "fsspec",
  "psycopg2-binary",
  "requests",
  "uuid-utils",
  "pydantic",
  "pydantic-settings",
  "dj-database-url",
]

[project.optional-dependencies]
dev = [
  "django-types",
  "ruff",
  "pytest",
  "pytest-django",
  "pytest-cov",
  "pyright",
  "python-lsp-server[all]",
  "types-click",
  "types-requests",
  "django-extensions",
]
nuitka = [
  "nuitka",
  "patchelf",
  "zstandard",
  "ordered-set",
  "wheel"
]

[project.urls]
Changelog = "https://github.com/esperoj/esperoj/releases/"
Documentation = "https://www.esperoj.eu.org/docs/"
Homepage = "https://www.esperoj.eu.org/"
"Issue Tracker" = "https://github.com/esperoj/esperoj/issues?q=is%3Aissue+is%3Aopen+sort%3Aupdated-desc"
Repository = "https://github.com/esperoj/esperoj"

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]
concurrency = ["multiprocessing", "thread"]
omit = ["*/tests/*"]
parallel = true
source = ["esperoj"]


[tool.pytest.ini_options]
addopts = "--color=yes --exitfirst --failed-first"
testpaths = ["tests"]
xfail_strict = true
markers = [
  "only: run this only"
]

[tool.ruff]
fix = true
line-length = 120
src = ["esperoj", "tests"]
target-version = "py311"
exclude = [
    "typings"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["esperoj"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.*" = [
  "A",
  "ARG",
  "B",
  "BLE",
  "C901",
  "D",
  "DTZ",
  "EM",
  "FBT",
  "G",
  "N",
  "PGH",
  "PIE",
  "PLR",
  "PLW",
  "PTH",
  "RSE",
  "S",
  "S101",
  "SIM",
  "TCH",
  "TRY",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
