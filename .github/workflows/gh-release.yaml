name: Release Binary

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: ./projects/esperoj

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            ./requirements.txt
            ./requirements-nuitka.txt

      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin

      - name: Setup
        run: |
          ENV=nuitka task setup
          cp esperoj/__main__.py .

      - uses: Nuitka/Nuitka-Action@main
        with:
          working-directory: "projects/esperoj"
          nuitka-version: main
          script-name: __main__.py
          standalone: true
          onefile: true
          output-dir: "build"

      - name: Change name
        run: |
          mv build/__main__.bin ./esperoj_linux_x86_64
          tar -czf esperoj_linux_x86_64.tar.gz -C build/__main__.dist .

      - name: Release
        uses: softprops/action-gh-release@master
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            projects/esperoj/esperoj_linux_x86_64
            projects/esperoj/esperoj_linux_x86_64.tar.gz