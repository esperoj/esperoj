name: Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./projects/esperoj


jobs:
  test:
    runs-on: ${{ vars.default_runner || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.12"]
    name: Python ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@main
        with:
          enable-cache: false
          # cache-dependency-glob: "projects/esperoj/requirements-dev.txt"
          # cache-suffix: ${{ runner.os }}-${{ matrix.python-version }}

      - name: Setup
        run: |
          uv python install ${{ matrix.python-version }}
          ENV=dev task setup

      - name: Test package
        run: task test

      - name: Send notification
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          MY_UUID: ${{ secrets.MY_UUID }}
        if: ${{ always() }}
        run: |
          curl -fsLS https://raw.githubusercontent.com/esperoj/dotfiles/refs/heads/main/bin/notify.sh | bash -s -- "" \
          "Title: Workflow ${{ github.workflow }} of ${{ github.repository }} completed" \
          "Actions: view, View log, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          | jq