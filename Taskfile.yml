version: '3'
dotenv: ['{{.HOMR}}/{{.MACHINE_NAME}}/.env', '{{.HOME}}/.env', '.env']
run: when_changed

tasks:
  setup:
    status:
      - test -d .venv
    cmds:
      - |
        python -m venv .venv
        source .venv/bin/activate
        poetry install --with build,cli,dev,server,test
  build:
    cmds:
      - |
        pdoc \
          --docformat google \
          --output-directory public/docs \
          esperoj
      - rclone sync workspace:backup ./backup
      - defer: rm -rf backup/
      - 7z a "-p${ENCRYPTION_PASSPHRASE}" backup.7z ./backup
      - mv backup.7z public
  nuitka: |
    cd src/
    cp esperoj/__main__.py .
    python -m nuitka --follow-imports --static-libpython=yes __main__.py
    rm __main__.py
  lint:
    cmds:
      - |
        pre-commit run \
            --all-files \
            --color always
  test:
    cmds:
      - pytest -n $(nproc)

  dev-server:
    cmds:
      - |
        litestar --app esperoj.server:app \
            run \
                --unix-domain-socket "${HOME}/.sockets/dev.sock" \
                --reload \
                --reload-dir="./src" \
                --reload-exclude="__pycache__"
  start:
    cmds:
      - |
        litestar --app esperoj.server:app \
            run --port ${PORT:-20711}

  release:
    cmds:
      - |
        export VERSION="$(python scripts/get_version.py)"
        git tag -a "v$VERSION" -m "Release version $VERSION"
        git push origin "v$VERSION"