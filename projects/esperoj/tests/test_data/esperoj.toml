[[storages]]
name = "testing_storage"
type = "s3"
aliases = [ "audio_storage", "document_storage" ]
bucket_name = "esperoj"

[storages.client_config]
aws_access_key_id = "testing"
aws_secret_access_key = "testing"

[storages.transfer_config]
max_concurrency = 4

[[databases]]
name = "testing_db"
type = "memory"

[[file_hosts]]
name = "local_file_host"
type = "local_file_host"
base_src = "/tmp/tests"