version: '3'
dotenv: ['{{.HOME}}/{{.MACHINE_NAME}}/.env', '{{.HOME}}/.env', '.env']
run: when_changed

tasks:
  setup:
    cmds:
      - pip install -r requirements-{{ or .ENV "dev" }}.txt
  build:
    cmds:
      - |
        pdoc \
          --docformat google \
          --output-directory public/docs \
          esperoj
  nuitka: |
    cd esperoj
    python -m nuitka \
      --static-libpython=yes \
      --standalone \
      --onefile \
      --include-package=esperoj \
      --output-dir="../build" \
      __main__.py
  lint:
    cmds:
      - |
        pre-commit run \
            --all-files \
            --color always
  test:
    cmds:
      - pytest -n $(nproc)
  deploy:
    deps: [build]
    cmds:
      - npx vercel deploy
      - rm -rf public/docs
  dev-server:
    cmds:
      - |
        litestar --app esperoj.server:app \
            run \
                --unix-domain-socket "${HOME}/.sockets/dev.sock" \
                --reload \
                --reload-dir="./src" \
                --reload-exclude="__pycache__"
  start:
    cmds:
      - |
        litestar --app esperoj.server:app \
            run --port ${PORT:-20711}
  release:
    cmds:
      - |
        export VERSION="$(python ../../scripts/get_version.py)"
        git tag -a "v$VERSION" -m "Release version $VERSION"
        git push origin "v$VERSION"