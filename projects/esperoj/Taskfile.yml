version: '3'

run: when_changed


tasks:
  setup:
    status:
      - test -d .venv
    cmds:
      - uv python install
      - uv venv
      - uv pip install -r requirements-{{or .ENV "dev"}}.txt
      - uv pip install -e .[cli,server]

  lock:
    cmds:
      - |
        uv pip compile pyproject.toml \
          --extra nuitka \
          --universal \
          --output-file requirements-nuitka.txt
      - |
        uv pip compile pyproject.toml \
          --extra dev \
          --universal \
          --output-file requirements-dev.txt

  nuitka:
    deps:
      - task: setup
        vars: { ENV: 'nuitka' }
    cmds:
      - cp esperoj/__main__.py .
      - defer: rm __main__.py
      - |
        uv run nuitka \
          --static-libpython=yes \
          --standalone \
          --onefile \
          --output-dir="build" \
          __main__.py

  lint:
    deps:
      - task: setup
        vars: { ENV: 'dev' }
    cmds: 
      - |
        uv run pre-commit run \
          --all-files \
          --color always
      - uv run pyright
      - |
        [ -z "$VIRTUAL_ENV" ] && source .venv/bin/activate || true
        if [ -d "${ESPEROJ_SCRIPTS_FOLDER}" ]; then
            cd "${ESPEROJ_SCRIPTS_FOLDER}"
            ruff check .
            ruff format .
            pyright .
        fi

  test:
    deps:
      - task: setup
        vars: { ENV: 'test' }
    cmds:
      - |
        [ -z "$VIRTUAL_ENV" ] && source .venv/bin/activate || true
        pytest -n $(nproc)

  dev-server:
    deps:
      - task: setup
        vars: { ENV: 'dev' }
    cmds:
      - |
        uv run litestar --app esperoj.server:app \
            run \
                --unix-domain-socket "${HOME}/.sockets/dev.sock" \
                --reload \
                --reload-dir="./esperoj" \
                --reload-exclude="__pycache__"

  start:
    deps:
      - task: setup
        vars: { ENV: 'server' }
    cmds:
      - |
        uv run litestar --app esperoj.server:app \
            run --port ${PORT:-20711}

  release:
    cmds:
      - |
        export VERSION="$(python ../../scripts/get_version.py)"
        git tag -a "v$VERSION" -m "Release version $VERSION"
        git push origin "v$VERSION"
