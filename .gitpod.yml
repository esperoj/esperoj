image: gitpod/workspace-full

tasks:
    - name: Setup dotfiles
      init: |
        curl -fsLS https://codeberg.org/esperoj/dotfiles/raw/branch/main/bin/install-dotfiles.sh | bash
        sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
        install.sh BASE ghbin caddyserver/caddy "linux_%arch:x86_64=amd64:aarch64=arm64%.tar.gz$" "caddy"
        task setup
      command: |
        source .venv/bin/activate
        task dev-server

ports:
    - port: 20711
      onOpen: caddy
      name: Caddy
      description: Caddy
      visibility: private
      protocol: https