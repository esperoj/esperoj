image: ghcr.io/esperoj/esperoj-dev

tasks:
    - name: Setup
      before: |
        ~/.local/bin/chezmoi init --apply --force
      init: |
        source ~/.profile
        ENV=dev task -t projects/esperoj/Taskfile.yml setup
      command: |
        source ~/.profile
        start.sh koofr caddy
        task -t projects/esperoj/Taskfile.yml dev-server

ports:
    - port: 20711
      name: Caddy
      onOpen: open-browser
      description: Caddy
      visibility: private
      protocol: https